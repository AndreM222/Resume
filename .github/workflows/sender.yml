name: Send CV Update

on:
  push:
    branches:
      - main
    paths:
      - "Papers/MS_Style/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch event
        env:
          PAT: ${{ secrets.PAT }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          payload=$(jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg message "$SOURCE_MESSAGE" \
            '{
              event_type: "project_update",
              client_payload: {
                source_sha: $sha,
                source_message: $message
              }
            }')

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/AndreM222/AndreMossi-Portfolio/dispatches" \
            -d "$payload"
